<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="KnightFall — RPG de fantasia sombria em texto.">
  <title>KnightFall</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="terminal-shell" aria-label="KnightFall">
    <header class="terminal-header">
      <span class="brand-mark">KNIGHT<span>FALL</span></span>
      <span class="status-light" aria-label="Autosave ativo">◆ AUTOSAVE</span>
    </header>

    <section id="terminal-output" class="terminal-output" aria-live="polite" aria-atomic="false"></section>

    <form id="terminal-form" class="terminal-input-row visually-hidden" autocomplete="off">
      <label for="terminal-input" class="prompt">&gt;</label>
      <input
        id="terminal-input"
        class="terminal-input"
        type="text"
        inputmode="text"
        spellcheck="false"
        aria-label="Digite uma opção ou comando"
        autofocus
      >
      <span class="cursor" aria-hidden="true"></span>
    </form>
  </main>

  <script type="module" src="js/game.js"></script>
</body>
</html>
